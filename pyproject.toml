[project]
name = "cross-border-payment-signal-layer"
version = "0.1.0"
description = "Data foundation for a cross-border payment exchange-rate signal layer."
authors = [{ name = "ITMO Cross-Border Payment Team" }]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pandas>=2.2,<3.0",
    "numpy>=2.0,<3.0",
    "uvicorn>=0.30,<1.0",
    "requests>=2.31,<3.0",
    "catboost>=1.2.10",
]

[tool.poetry]
packages = [{ include = "signal_layer", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9.0"
ruff = ">=0.8,<1.0"
httpx = ">=0.27,<1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
