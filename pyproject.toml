[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cross-border-payment-signal-layer"
version = "0.2.0"
description = "Point-in-time FX signals, calibrated risk models and walk-forward evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<2.4", "pandas>=2.2,<3", "scipy>=1.12,<2",
  "scikit-learn>=1.5,<2", "catboost>=1.2.7,<2",
  "plotly>=6,<7", "PyYAML>=6,<7", "joblib>=1.4,<2", "requests>=2.31,<3",
]

[project.scripts]
fx-signals = "signal_layer.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/signal_layer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
